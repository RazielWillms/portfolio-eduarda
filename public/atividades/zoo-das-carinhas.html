<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo das Carinhas – Clube da Massinha</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #D95C2A;
  --orange-light: #E87040;
  --orange-dark: #B84820;
  --cream: #FAF4EC;
  --dark: #2C1810;
  --shadow: rgba(44,24,16,0.15);
  --green: #27AE60;
  --red: #E53935;
}
*{ box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:'Nunito',sans-serif;
  background: var(--cream);
  min-height:100vh;
  overflow-x:hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(217,92,42,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(217,92,42,0.07) 0%, transparent 55%);
  pointer-events:none; z-index:0;
}

/* ───────────── INTRO ───────────── */
#intro {
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background: var(--orange);
  padding:20px;
}
.intro-brand {
  font-size:12px; font-weight:700;
  color:rgba(255,255,255,0.6);
  letter-spacing:1.5px; margin-bottom:10px;
  text-transform:uppercase;
}
.intro-card {
  background:white; border-radius:28px;
  padding:32px 28px 28px;
  max-width:460px; width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,0.28);
  position:relative; overflow:hidden;
  text-align:center;
}
.intro-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, var(--orange), #F5A623, var(--orange));
}
.mascots-strip {
  display:flex; justify-content:center;
  gap:8px; margin-bottom:20px; font-size:34px;
}
.mascots-strip img{
  width:54px; height:54px; border-radius:14px;
  display:block; object-fit:cover;
  background:var(--cream);
  border:3px solid var(--cream);
  box-shadow:0 4px 12px var(--shadow);
  transition:transform .2s;
}
.mascots-strip img:hover{ transform:translateY(-5px) scale(1.1); }

.intro-title {
  font-family:'Baloo 2',cursive;
  font-size:30px; font-weight:800;
  color:var(--orange); line-height:1.15;
  margin-bottom:4px;
}
.intro-sub {
  font-size:12px; font-weight:700; color:#ccc;
  letter-spacing:1px; text-transform:uppercase;
  margin-bottom:22px;
}
.rules-box {
  background:var(--cream); border-radius:16px;
  padding:16px 18px; margin-bottom:22px;
  text-align:left;
}
.rule {
  display:flex; align-items:flex-start;
  gap:10px; margin-bottom:10px;
  font-size:14px; font-weight:600;
  color:var(--dark); line-height:1.4;
}
.rule:last-child { margin-bottom:0; }
.rn {
  width:26px; height:26px; border-radius:50%;
  background:var(--orange); color:white;
  font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.btn-start {
  background:var(--orange); color:white;
  border:none; border-radius:50px;
  padding:15px 40px;
  font-family:'Baloo 2',cursive;
  font-size:20px; font-weight:700;
  cursor:pointer; width:100%;
  box-shadow:0 6px 24px rgba(217,92,42,0.45);
  transition:transform .15s, box-shadow .15s;
}
.btn-start:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(217,92,42,0.55); }
.btn-start:active { transform:translateY(0); }

/* ───────────── GAME ───────────── */
#game {
  display:none; flex-direction:column;
  min-height:100vh; padding:14px 12px;
  position:relative; z-index:1;
}
.game-header {
  display:flex; align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  flex-wrap:wrap; gap:8px;
}
.game-logo {
  font-family:'Baloo 2',cursive;
  font-size:19px; font-weight:800;
  color:var(--orange); line-height:1.2;
}
.score-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.chip {
  background:white; border-radius:50px;
  padding:6px 14px; font-size:13px;
  font-weight:800; color:var(--orange-dark);
  box-shadow:0 2px 8px var(--shadow);
  display:flex; align-items:center; gap:4px;
}
.chip.green { color:#1B7A44; }
.chip.red   { color:#B71C1C; }
.btn-restart {
  background:var(--orange); color:white;
  border:none; border-radius:50px;
  padding:7px 16px; font-size:13px;
  font-weight:800; cursor:pointer;
  transition:transform .15s;
  font-family:'Nunito',sans-serif;
}
.btn-restart:hover { transform:scale(1.05); }

.progress-wrap { max-width:580px; margin:0 auto 14px; width:100%; }
.progress-track { height:9px; background:#e8e0d8; border-radius:50px; overflow:hidden; }
.progress-fill {
  height:100%; background:linear-gradient(90deg, var(--orange-dark), var(--orange-light));
  border-radius:50px; transition:width .5s cubic-bezier(.4,0,.2,1); width:0%;
}
.progress-label {
  display:flex; justify-content:space-between;
  font-size:11px; font-weight:700; color:#aaa;
  margin-top:4px; padding:0 2px;
}

.q-card {
  background:white; border-radius:24px;
  padding:22px 20px 18px;
  max-width:580px; width:100%;
  margin:0 auto 18px;
  box-shadow:0 4px 24px var(--shadow);
  text-align:center;
  position:relative;
}
.q-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--orange), #F5A623);
  border-radius:24px 24px 0 0;
}
.q-eyebrow {
  font-size:10px; font-weight:800; color:#ccc;
  letter-spacing:2px; text-transform:uppercase;
  margin-bottom:6px;
}
.q-prompt {
  font-size:15px; font-weight:700; color:#8a7a6d;
  margin-bottom:2px;
}
.q-name {
  font-family:'Baloo 2',cursive;
  font-size:44px; font-weight:800;
  color:var(--orange); line-height:1;
  margin-bottom:6px;
  animation: nameIn .3s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes nameIn { from { transform:scale(.8); opacity:0; } to { transform:scale(1); opacity:1; } }
.speak-btn {
  background:none; border:2px solid var(--orange);
  border-radius:50px; padding:6px 18px;
  font-size:13px; font-weight:800;
  color:var(--orange); cursor:pointer;
  transition:all .15s;
  display:inline-flex; align-items:center; gap:6px;
  font-family:'Nunito',sans-serif;
}
.speak-btn:hover { background:var(--orange); color:white; }
.speak-btn.speaking { background:var(--orange); color:white; animation:pulse .6s infinite alternate; }
@keyframes pulse { to { box-shadow:0 0 0 6px rgba(217,92,42,0.2); } }

.options-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:580px; margin:0 auto; width:100%;
}
@media(max-width:480px) {
  .options-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .q-name { font-size:38px; }
}
.opt {
  background:white; border-radius:20px;
  border:3px solid #f0e8de;
  cursor:pointer; overflow:hidden;
  box-shadow:0 4px 14px var(--shadow);
  transition:transform .15s, border-color .2s, box-shadow .15s;
  position:relative;
  aspect-ratio:1/1;
}
.opt:hover:not(.done) {
  transform:translateY(-5px) scale(1.04);
  box-shadow:0 12px 28px var(--shadow);
  border-color:var(--orange-light);
}
.opt img { width:100%; height:100%; display:block; object-fit:cover; -webkit-user-drag:none; user-select:none; }

.opt.correct {
  border-color:var(--green);
  box-shadow:0 0 0 3px var(--green), 0 8px 24px rgba(39,174,96,0.25);
  animation:correctPop .45s cubic-bezier(.175,.885,.32,1.275);
}
.opt.wrong {
  border-color:var(--red);
  box-shadow:0 0 0 3px var(--red), 0 4px 12px rgba(229,57,53,0.2);
  animation:wrongShake .4s ease;
}
.opt.reveal { border-color:var(--green); box-shadow:0 0 0 3px var(--green); opacity:0.7; }
.opt.done { cursor:default; pointer-events:none; }

.opt-badge {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:40px; z-index:2;
  transition:transform .25s cubic-bezier(.175,.885,.32,1.275);
  pointer-events:none;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
}
.opt.correct .opt-badge, .opt.wrong .opt-badge, .opt.reveal .opt-badge { transform:translate(-50%,-50%) scale(1); }

@keyframes correctPop { 0% { transform:scale(0.92); } 60% { transform:scale(1.05); } 100% { transform:scale(1); } }
@keyframes wrongShake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }

/* ───────────── WIN MODAL ───────────── */
#win {
  display:none; position:fixed; inset:0;
  background:rgba(180,60,10,0.88);
  backdrop-filter:blur(4px);
  z-index:200; align-items:center;
  justify-content:center; padding:20px;
}
#win.show { display:flex; }
.win-box {
  background:white; border-radius:28px;
  padding:40px 28px; text-align:center;
  max-width:360px; width:100%;
  animation:popIn .5s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes popIn { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
.win-big { font-size:64px; margin-bottom:10px; }
.win-title {
  font-family:'Baloo 2',cursive;
  font-size:30px; font-weight:800;
  color:var(--orange); margin-bottom:6px;
}
.win-sub { font-size:14px; color:#aaa; font-weight:600; margin-bottom:18px; }
.win-stats { display:flex; gap:12px; justify-content:center; margin-bottom:28px; }
.stat-pill { border-radius:50px; padding:10px 20px; font-size:16px; font-weight:800; }
.stat-pill.g { background:#EAFAF1; color:#1B7A44; }
.stat-pill.r { background:#FDEDEC; color:#B71C1C; }
.star-row { font-size:28px; margin-bottom:20px; }
.btn-again {
  background:var(--orange); color:white;
  border:none; border-radius:50px;
  padding:14px 36px;
  font-family:'Baloo 2',cursive;
  font-size:18px; font-weight:700;
  cursor:pointer; width:100%;
  box-shadow:0 6px 20px rgba(217,92,42,0.4);
  transition:transform .15s;
}
.btn-again:hover { transform:scale(1.03); }

#toast {
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--dark); color:white;
  padding:11px 28px; border-radius:50px;
  font-size:15px; font-weight:700;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:500; white-space:nowrap;
  pointer-events:none;
}
#toast.show { transform:translateX(-50%) translateY(0); }

.cp { position:fixed; top:-20px; border-radius:2px; z-index:300; animation:fall linear forwards; pointer-events:none; }
@keyframes fall { to { top:110vh; transform:rotate(720deg); } }
</style>
</head>
<body>

<!-- ═══════════════ INTRO ═══════════════ -->
<div id="intro">
  <p class="intro-brand">@edchiodi</p>

  <div class="intro-card">
    <div class="mascots-strip" id="mascots-strip"></div>

    <div class="intro-title">Zoo das<br>Carinhas</div>

    <div class="rules-box">
      <div class="rule">
        <div class="rn">1</div>
        <span>O <strong>nome de uma emoção</strong> vai aparecer na tela.</span>
      </div>
      <div class="rule">
        <div class="rn">2</div>
        <span>Toque em 🔊 para <strong>ouvir o nome</strong> em voz alta.</span>
      </div>
      <div class="rule">
        <div class="rn">3</div>
        <span><strong>Clique no bichinho</strong> que está sentindo essa emoção!</span>
      </div>
      <div class="rule">
        <div class="rn">4</div>
        <span>Acerte todas as <strong>10 rodadas</strong> e ganhe! 🌟</span>
      </div>
    </div>

    <button class="btn-start" onclick="startGame()">Vamos jogar! 🎮</button>
  </div>
</div>

<!-- ═══════════════ GAME ═══════════════ -->
<div id="game">
  <div class="game-header">
    <div class="game-logo">Zoo das<br>Carinhas</div>
    <div class="score-row">
      <div class="chip green">✅ <span id="c-correct">0</span></div>
      <div class="chip red">❌ <span id="c-wrong">0</span></div>
      <button class="btn-restart" onclick="restartGame()">↺ Reiniciar</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    <div class="progress-label">
      <span id="p-round">Rodada 1 de 10</span>
      <span id="p-pct">0%</span>
    </div>
  </div>

  <div class="q-card">
    <div class="q-eyebrow">encontre quem está</div>
    <div class="q-name" id="qname">–</div>
    <button class="speak-btn" id="speakbtn" onclick="speak()">🔊 Ouvir</button>
  </div>

  <div class="options-grid" id="grid"></div>
</div>

<!-- ═══════════════ WIN ═══════════════ -->
<div id="win">
  <div class="win-box">
    <div class="win-big" id="win-trophy">🏆</div>
    <div class="win-title">Parabéns!</div>
    <div class="win-sub" id="win-stars">⭐⭐⭐</div>
    <div class="win-stats">
      <div class="stat-pill g">✅ <span id="fc">0</span></div>
      <div class="stat-pill r">❌ <span id="fw">0</span></div>
    </div>
    <button class="btn-again" onclick="restartGame()">Jogar de novo 🔁</button>
  </div>
</div>

<div id="toast"></div>

  },

const TOTAL = 10;
const OPTS = 3;
let rounds=[], cur=0, nCorrect=0, nWrong=0, busy=false;

function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

/* ---------- geração das rodadas ---------- */
/* Agora cada bichinho tem as 6 emoções (36 imagens no total). Para cada rodada:
   - sorteia a emoção-alvo
   - sorteia um bichinho aleatório para ser o "dono" da emoção-alvo (resposta certa)
   - sorteia (OPTS-1) distratores dentre TODAS as combinações bicho+emoção erradas
     (pode inclusive repetir o mesmo bichinho com outra emoção, deixando o jogo
     mais desafiador: a criança precisa olhar a carinha, não só reconhecer o bicho) */
function allCombos() {
  const combos = [];
  ANIMAL_NAMES.forEach(name => {
    EMOTIONS.forEach(e => {
      combos.push({ name, emotionId: e.id, img: IMAGES[name][e.id] });
    });
  });
  return combos;
}

function buildRounds() {
  const base = shuffle([...EMOTIONS]);
  const extra = shuffle([...EMOTIONS]).slice(0, TOTAL - EMOTIONS.length);
  const targets = shuffle([...base, ...extra]);
  const combos = allCombos();

  return targets.map(target => {
    const correctAnimalName = ANIMAL_NAMES[Math.floor(Math.random()*ANIMAL_NAMES.length)];
    const correct = { name: correctAnimalName, emotionId: target.id, img: IMAGES[correctAnimalName][target.id] };

    const pool = shuffle(combos.filter(c => c.emotionId !== target.id));
    const distractors = [];
    const used = new Set([correctAnimalName + '-' + target.id]);
    for (const c of pool) {
      const key = c.name + '-' + c.emotionId;
      if (used.has(key)) continue;
      used.add(key);
      distractors.push(c);
      if (distractors.length >= OPTS - 1) break;
    }

    const options = shuffle([correct, ...distractors]);
    return { target, options };
  });
}

/* ---------- tela inicial ---------- */
document.getElementById('mascots-strip').innerHTML = ANIMAL_NAMES
  .map(name => `<img src="${IMAGES[name][1]}" alt="${name}">`).join('');

/* ---------- jogo ---------- */
function startGame() {
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='flex';
  restartGame();
}

function restartGame() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('win').classList.remove('show');
  rounds = buildRounds(); cur=0; nCorrect=0; nWrong=0; busy=false;
  updateScore();
  render();
}

function render() {
  busy=false;
  const r = rounds[cur];
  const pct = Math.round((cur/TOTAL)*100);
  document.getElementById('pfill').style.width = pct+'%';
  document.getElementById('p-round').textContent = `Rodada ${cur+1} de ${TOTAL}`;
  document.getElementById('p-pct').textContent = pct+'%';

  const qn = document.getElementById('qname');
  qn.textContent = r.target.name;
  qn.style.animation='none';
  void qn.offsetWidth;
  qn.style.animation='';
  document.getElementById('speakbtn').classList.remove('speaking');

  const grid = document.getElementById('grid');
  grid.innerHTML='';
  r.options.forEach(opt => {
    const d = document.createElement('div');
    d.className='opt';
    d.innerHTML = `<img src="${opt.img}" alt="${opt.name}" draggable="false"><div class="opt-badge"></div>`;
    d.dataset.emotionId = opt.emotionId;
    d.addEventListener('click', () => pick(opt.emotionId, r.target.id, d));
    grid.appendChild(d);
  });

  setTimeout(speak, 400);
}

function pick(selId, targetId, el) {
  if(busy) return;
  busy=true;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('done'));

  if(selId===targetId) {
    el.classList.add('correct');
    el.querySelector('.opt-badge').textContent='✅';
    nCorrect++;
    toast('🎉 Isso mesmo!');
  } else {
    el.classList.add('wrong');
    el.querySelector('.opt-badge').textContent='❌';
    document.querySelectorAll('.opt').forEach(o=>{
      if(parseInt(o.dataset.emotionId)===targetId) {
        o.classList.add('reveal');
        o.querySelector('.opt-badge').textContent='✅';
      }
    });
    nWrong++;
    toast('😅 Quase! Tente de novo!');
  }
  updateScore();

  setTimeout(()=>{
    cur++;
    if(cur>=TOTAL) showWin();
    else render();
  },1500);
}

function updateScore() {
  document.getElementById('c-correct').textContent=nCorrect;
  document.getElementById('c-wrong').textContent=nWrong;
}

let synthTimer=null;
function speak() {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  if(synthTimer) clearTimeout(synthTimer);
  const name=document.getElementById('qname').textContent;
  if(name==='–') return;
  const btn=document.getElementById('speakbtn');
  btn.classList.add('speaking');
  const u=new SpeechSynthesisUtterance(name);
  u.lang='pt-BR'; u.rate=0.8; u.pitch=1.1;
  u.onend=()=>btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
  synthTimer=setTimeout(()=>btn.classList.remove('speaking'),3000);
}

function showWin() {
  document.getElementById('pfill').style.width='100%';
  document.getElementById('p-round').textContent='Concluído!';
  document.getElementById('p-pct').textContent='100%';
  document.getElementById('fc').textContent=nCorrect;
  document.getElementById('fw').textContent=nWrong;
  const stars = nCorrect>=9?3:nCorrect>=7?2:1;
  document.getElementById('win-stars').textContent='⭐'.repeat(stars);
  document.getElementById('win-trophy').textContent = stars===3?'🏆':stars===2?'🥈':'🥉';
  document.getElementById('win').classList.add('show');
  launchConfetti();
}

let toastTimer=null;
function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

function launchConfetti() {
  const cols=['#D95C2A','#F5A623','#27AE60','#2980B9','#E53935','#F5C518','#9B59B6'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div');
    p.className='cp';
    const size=6+Math.random()*10;
    p.style.cssText=`
      left:${Math.random()*100}vw;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      width:${size}px; height:${size}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.5+Math.random()*2.5}s;
      animation-delay:${Math.random()*.9}s;
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend',()=>p.remove());
  }
}
</script>
